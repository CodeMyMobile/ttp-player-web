[build]
  command = "npm run build"
  publish = "dist"

# Feature flags pinned for the build. Vite inlines import.meta.env.VITE_* at
# build time, so this must live in the build environment (a redeploy is required
# after changes). Global so deploy previews mirror production's create flow.
# VITE_MULTI_MATCH=true renders the multi-match creation modal
# (MultiMatchCreatorFlow) instead of the legacy single-match flow.
[build.environment]
  VITE_MULTI_MATCH = "true"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
