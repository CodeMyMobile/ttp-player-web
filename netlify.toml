[build]
  command = "npm run build"
  publish = "dist"

# Feature flags pinned for the build. Vite inlines import.meta.env.VITE_* at
# build time, so this must live in the build environment (a redeploy is required
# after changes — re-running an existing build will not pick up a change here).
#
# VITE_MULTI_MATCH=true renders the multi-match creation modal
# (MultiMatchCreatorFlow) instead of the legacy single-match flow.
#
# VITE_HOME_V2=true renders the redesigned home page instead of DashboardPage
# (App.jsx). It was preview-only while the sequence was built; now that every
# section the mockups draw has shipped, it is on everywhere.
#
# To roll back: delete the VITE_HOME_V2 line and redeploy. Flag off is
# structurally identical to the old home — DashboardPage was never modified for
# the redesign — so there is nothing to undo beyond the flag itself.
#
# Values must be one of "1", "true", "on" or "yes" — src/utils/featureFlags.ts
# matches those exactly. "TRUE", "enabled" and any other string read as off, and
# an off flag is indistinguishable from an unset one.
[build.environment]
  VITE_MULTI_MATCH = "true"
  VITE_HOME_V2 = "true"


# Permanent (301) redirects from the long-form legal URLs to the canonical
# short URLs. These MUST come before the SPA catch-all below — Netlify applies
# redirect rules top-to-bottom, first match wins.
[[redirects]]
  from = "/privacy-policy"
  to = "/privacy/"
  status = 301
  force = true

[[redirects]]
  from = "/terms-of-service"
  to = "/terms/"
  status = 301
  force = true

# SPA fallback. This does NOT override real files, so the statically generated
# /privacy/ and /terms/ pages (dist/privacy/index.html, dist/terms/index.html)
# are served directly rather than falling through to the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
