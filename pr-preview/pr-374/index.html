<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Tennis Plan</title>
    <meta name="description" content="Book coaches, join group lessons, and play matches across West LA." />

    <!--
      Home-screen and tab icons.

      These MUST be static tags in this file. iOS reads the head of the served
      HTML before any JavaScript runs, so a link element appended at runtime is
      invisible to "Add to Home Screen" — the icon silently falls back to a
      screenshot or a grey tile.

      Note the SPA catch-all in netlify.toml (`/* -> /index.html`, 200) does not
      override real files, but it does answer requests for files that DO NOT
      exist with an HTML document and a 200. That is what produced the grey
      placeholder before: iOS probed /apple-touch-icon.png, got HTML, and could
      not decode it. If an icon ever disappears from public/, the symptom will
      be a 200 of text/html rather than an honest 404 — check the content-type,
      not the status code.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Standalone (home-screen) behaviour on iOS. -->
    <meta name="apple-mobile-web-app-title" content="Tennis Plan" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Modern equivalent; iOS still honours the apple- prefixed one above. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default" keeps the status bar legible over the app's light surfaces;
         black-translucent would let content slide under the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#8B5CF6" />

    <!--
      The app is not indexed. Every client route is served from this one file (the SPA
      rewrite) and routing is hash-based, so a single meta here covers every route by
      construction — there is no per-route header to match, because the server never sees
      the route. Find Players in particular is a directory of members who did not ask to
      be public.

      Deliberately NOT paired with a robots.txt Disallow: a crawler must be able to fetch
      a page to read this tag, and a Disallow would leave URLs indexable from inbound
      links while hiding the directive that removes them.

      This does not affect /s/* — the share gateway edge function renders its own HTML.
      Marketing pages belong on a separate path or property.
    -->
    <meta name="robots" content="noindex, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="The Tennis Plan" />
    <meta property="og:description" content="Book coaches, join group lessons, and play matches across West LA." />
    <meta property="og:url" content="https://app.thetennisplan.com" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://app.thetennisplan.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://app.thetennisplan.com/og-image.png" />
    <script type="module" crossorigin src="/assets/index-BdDR-IYM.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DbYiPiwo.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
