<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Tennis Plan</title>
    <meta name="description" content="Book coaches, join group lessons, and play matches across West LA." />

    <!--
      The app is not indexed. Every client route is served from this one file (the SPA
      rewrite) and routing is hash-based, so a single meta here covers every route by
      construction — there is no per-route header to match, because the server never sees
      the route. Find Players in particular is a directory of members who did not ask to
      be public.

      Deliberately NOT paired with a robots.txt Disallow: a crawler must be able to fetch
      a page to read this tag, and a Disallow would leave URLs indexable from inbound
      links while hiding the directive that removes them.

      This does not affect /s/* — the share gateway edge function renders its own HTML.
      Marketing pages belong on a separate path or property.
    -->
    <meta name="robots" content="noindex, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="The Tennis Plan" />
    <meta property="og:description" content="Book coaches, join group lessons, and play matches across West LA." />
    <meta property="og:url" content="https://app.thetennisplan.com" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://app.thetennisplan.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://app.thetennisplan.com/og-image.png" />
    <script type="module" crossorigin src="/assets/index-BX72Wbh6.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DVA3GRZ4.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
