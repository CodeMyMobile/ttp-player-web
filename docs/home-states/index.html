  <div class="flex flex-wrap gap-6">
    <div class="flex flex-col">
      <div class="mb-2 flex items-baseline gap-2">
        <h2 class="text-sm font-semibold text-slate-900">Cold start</h2>

    </div>
    <div class="flex flex-col">
      <div class="mb-2 flex items-baseline gap-2">
        <h2 class="text-sm font-semibold text-slate-900">Rated, no league</h2>
        <a href="rated.html" target="_blank" class="text-xs text-violet-600">open →</a>
      </div>
      <iframe src="rated.html" class="h-[760px] w-[400px] rounded-2xl border border-slate-300 bg-white shadow-sm"></iframe>
    </div>
    <div class="flex flex-col">
      <div class="mb-2 flex items-baseline gap-2">
        <h2 class="text-sm font-semibold text-slate-900">Rated, nothing booked</h2>
        <a href="rated-no-bookings.html" target="_blank" class="text-xs text-violet-600">open →</a>
      </div>
      <iframe src="rated-no-bookings.html" class="h-[760px] w-[400px] rounded-2xl border border-slate-300 bg-white shadow-sm"></iframe>
    </div>
    <div class="flex flex-col">
      <div class="mb-2 flex items-baseline gap-2">
        <h2 class="text-sm font-semibold text-slate-900">In a league, no invite</h2>
        <a href="in-league.html" target="_blank" class="text-xs text-violet-600">open →</a>
      </div>
      <iframe src="in-league.html" class="h-[760px] w-[400px] rounded-2xl border border-slate-300 bg-white shadow-sm"></iframe>
    </div>
    <div class="flex flex-col">
      <div class="mb-2 flex items-baseline gap-2">
        <h2 class="text-sm font-semibold text-slate-900">Invite — confirming decline</h2>
        <a href="decline-confirm.html" target="_blank" class="text-xs text-violet-600">open →</a>
      </div>
      <iframe src="decline-confirm.html" class="h-[760px] w-[400px] rounded-2xl border border-slate-300 bg-white shadow-sm"></iframe>
    </div>
    <div class="flex flex-col">
      <div class="mb-2 flex items-baseline gap-2">
        <h2 class="text-sm font-semibold text-slate-900">Playlist unavailable (degraded)</h2>

      </div>
      <iframe src="video-unavailable.html" class="h-[760px] w-[400px] rounded-2xl border border-slate-300 bg-white shadow-sm"></iframe>
