<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Players tab — inline contact</title>
<style>
  :root{
    --purple:#6D5AE6;
    --purple-dark:#5847cc;
    --purple-tint:#EDEAFD;
    --page:#F4F4F7;
    --card:#FFFFFF;
    --line:#EAEAEF;
    --line-strong:#D9D9E2;
    --ink:#15151B;
    --ink-2:#7C7C88;
    --ink-3:#A2A2AE;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--page);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  .topbar{
    background:var(--card);border-bottom:1px solid var(--line);
    padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;
  }
  .brand{font-weight:600;font-size:17px;letter-spacing:-.01em}
  .brand span{color:var(--purple)}
  .league{margin-left:auto;font-size:13px;color:var(--ink-2)}

  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 64px}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
  .tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;
    padding:10px 14px;font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
  .tab[aria-selected="true"]{color:var(--purple);border-bottom-color:var(--purple);font-weight:500}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .count{font-size:13px;color:var(--ink-2);margin-right:auto}
  button.act{appearance:none;font:inherit;font-size:13px;cursor:pointer;background:var(--card);
    color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px 13px}
  button.act:hover{border-color:var(--purple);color:var(--purple)}
  button.act.primary{background:var(--purple);border-color:var(--purple);color:#fff}
  button.act.primary:hover{background:var(--purple-dark)}
  :focus-visible{outline:2px solid var(--purple);outline-offset:2px}

  .sim{display:flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;background:var(--card)}
  .sim button{appearance:none;border:0;background:none;font:inherit;font-size:12px;padding:7px 11px;cursor:pointer;color:var(--ink-2)}
  .sim button[aria-pressed="true"]{background:var(--purple-tint);color:var(--purple-dark);font-weight:500}
  .sim-label{font-size:12px;color:var(--ink-3)}

  .grid{display:grid;gap:8px}
  @media(min-width:780px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .player{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px}
  .avatar{width:38px;height:38px;border-radius:50%;flex:none;background:var(--purple-tint);
    color:var(--purple-dark);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .avatar.muted{background:#F0F0F4;color:var(--ink-2)}
  .who{flex:1;min-width:0}
  .name{font-weight:600;font-size:15px;letter-spacing:-.01em;display:block}
  .meta{font-size:12px;color:var(--ink-2);display:block;margin-top:1px}
  .tel{font-size:13px;color:var(--ink);display:block;margin-top:3px;font-variant-numeric:tabular-nums}
  .tel.none{color:var(--ink-3);font-size:12px}

  .chans{display:flex;gap:6px;flex:none}
  .chip{
    appearance:none;text-decoration:none;cursor:pointer;
    width:34px;height:34px;border-radius:9px;
    border:1px solid var(--line-strong);background:var(--card);color:var(--ink-2);
    display:flex;align-items:center;justify-content:center;
  }
  .chip:hover{border-color:var(--purple);color:var(--purple);background:#FBFAFF}
  .chip.done{border-color:var(--purple);color:var(--purple);background:var(--purple-tint)}
  .chip svg{width:17px;height:17px}

  .note{font-size:12px;color:var(--ink-3);margin:16px 0 0}
  .live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">The Tennis <span>Plan</span></div>
  <div class="league">Men's 4.0 fall flex league 2026</div>
</header>

<div class="wrap">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="false">Ladder</button>
    <button class="tab" role="tab" aria-selected="false">Standings</button>
    <button class="tab" role="tab" aria-selected="true">Players</button>
    <button class="tab" role="tab" aria-selected="false">Results</button>
    <button class="tab" role="tab" aria-selected="false">Pending</button>
  </div>

  <div class="toolbar">
    <span class="count" id="count"></span>
    <span class="sim-label">Preview as</span>
    <div class="sim" role="group" aria-label="Preview platform">
      <button id="simTouch" aria-pressed="true">Phone</button>
      <button id="simDesk" aria-pressed="false">Desktop</button>
    </div>
    <button class="act" id="vcf">Save all contacts</button>
    <button class="act primary">Need a match</button>
  </div>

  <div class="grid" id="grid"></div>
  <p class="note" id="footnote"></p>
</div>

<div class="live" role="status" aria-live="polite" id="live"></div>

<script>
const ME="Paul", LEAGUE="Men's 4.0 fall flex league", SLUG="mens-4-0-fall-flex-2026", LEVEL="4.0 flex";

const players=[
 {n:"Adam Kulakow",tpr:null,ntrp:"4.00",utr:null,tel:"+13105550148",share:true},
 {n:"Alex Gerszten",tpr:6.7,ntrp:"4.00",utr:8.4,tel:"+13105550193",share:true},
 {n:"Bass",tpr:null,ntrp:"3.50",utr:null,tel:"+13105550117",share:false},
 {n:"Ben I",tpr:null,ntrp:"4.00",utr:null,tel:"+13105550164",share:true},
 {n:"Cameron Kohlmeyer",tpr:5.7,ntrp:"3.75",utr:6.0,tel:"+13105550132",share:true},
 {n:"Chad Kushner",tpr:5.5,ntrp:"3.75",utr:5.7,tel:"+13105550109",share:true},
 {n:"Danny Eide",tpr:5.8,ntrp:"4.00",utr:6.1,tel:"+13105550175",share:true},
 {n:"Dylan Yawger",tpr:5.4,ntrp:"3.75",utr:5.7,tel:"+13105550188",share:true},
 {n:"Federico Gagliardone",tpr:6.6,ntrp:"4.25",utr:7.3,tel:"+13105550121",share:true},
 {n:"Hesham Aly",tpr:6.0,ntrp:"4.00",utr:6.5,tel:"+13105550156",share:true},
 {n:"Ken Esman",tpr:6.0,ntrp:"4.00",utr:6.5,tel:"+13105550143",share:false},
 {n:"Leo Hoenighausen",tpr:6.0,ntrp:"4.00",utr:6.5,tel:"+13105550170",share:true},
 {n:"Navid Moshtaghi",tpr:6.0,ntrp:"4.00",utr:6.5,tel:"+13105550185",share:true},
 {n:"Nick Shapiro",tpr:6.0,ntrp:"4.00",utr:6.5,tel:"+13105550138",share:true},
 {n:"OA Skywalker",tpr:4.4,ntrp:"3.25",utr:4.2,tel:"+13105550199",share:true},
 {n:"Peter Bergren",tpr:6.6,ntrp:"4.25",utr:7.4,tel:"+13105550152",share:true}
];

const I={
 msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.6-.7L3 21l1.9-4.9A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"/></svg>',
 tel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
 wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21l1.7-4.3A8.5 8.5 0 1 1 8 20.2z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5"/></svg>',
 copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
 lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 14v4M10 16h4"/></svg>'
};

let touch=true;
const ini=n=>n.split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const first=n=>n.split(/\s+/)[0];
const pretty=t=>{const d=t.replace(/\D/g,"").slice(-10);return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`};
const meta=p=>`${p.tpr==null?"TPR —":"TPR "+p.tpr.toFixed(1)} · NTRP ${p.ntrp} · ${p.utr==null?"UTR unrated":"UTR "+p.utr.toFixed(1)} · 0–0`;
const body=p=>`Hi ${first(p.n)} — ${ME} here from the ${LEAGUE}. Want to get our match in?`;

function render(){
  const g=document.getElementById("grid");g.innerHTML="";
  const shared=players.filter(p=>p.share).length;
  document.getElementById("count").textContent=`${players.length} players`;
  document.getElementById("vcf").style.display=shared>=2?"":"none";
  document.getElementById("footnote").textContent=
    `${shared} of ${players.length} players share a number with this division. The rest can be reached with a match invite.`;

  players.forEach(p=>{
    const el=document.createElement("div");el.className="player";
    const enc=encodeURIComponent(body(p));
    let chans;
    if(!p.share){
      chans=`<button class="chip" data-cal="1" aria-label="Propose a match with ${p.n}">${I.cal}</button>`;
    }else if(touch){
      chans=`<a class="chip" href="sms:${p.tel}?body=${enc}" aria-label="Text ${p.n}">${I.msg}</a>
             <a class="chip" href="tel:${p.tel}" aria-label="Call ${p.n}">${I.tel}</a>
             <a class="chip" href="https://wa.me/${p.tel.replace(/\D/g,"")}?text=${enc}" target="_blank" rel="noopener" aria-label="WhatsApp ${p.n}">${I.wa}</a>`;
    }else{
      chans=`<button class="chip" data-tel="${p.tel}" aria-label="Copy number for ${p.n}">${I.copy}</button>
             <a class="chip" href="https://wa.me/${p.tel.replace(/\D/g,"")}?text=${enc}" target="_blank" rel="noopener" aria-label="WhatsApp ${p.n}">${I.wa}</a>
             <button class="chip" data-cal="1" aria-label="Propose a match with ${p.n}">${I.cal}</button>`;
    }
    el.innerHTML=`
      <span class="avatar${p.share?"":" muted"}">${ini(p.n)}</span>
      <span class="who">
        <span class="name">${p.n}</span>
        <span class="meta">${meta(p)}</span>
        ${p.share?`<span class="tel">${pretty(p.tel)}</span>`
                 :`<span class="tel none">Number not shared</span>`}
      </span>
      <span class="chans">${chans}</span>`;
    g.appendChild(el);
  });
}

document.addEventListener("click",async e=>{
  const b=e.target.closest(".chip[data-tel]");if(!b)return;
  try{await navigator.clipboard.writeText(b.dataset.tel)}catch(_){}
  b.classList.add("done");document.getElementById("live").textContent="Number copied";
  setTimeout(()=>b.classList.remove("done"),1400);
});

function mode(t){touch=t;
  document.getElementById("simTouch").setAttribute("aria-pressed",t);
  document.getElementById("simDesk").setAttribute("aria-pressed",!t);render();}
document.getElementById("simTouch").onclick=()=>mode(true);
document.getElementById("simDesk").onclick=()=>mode(false);

document.getElementById("vcf").onclick=()=>{
  const v=players.filter(p=>p.share).map(p=>["BEGIN:VCARD","VERSION:3.0",
    `FN:${p.n} (${LEVEL})`,`N:${p.n.split(/\s+/).slice(1).join(" ")};${first(p.n)};;;`,
    `TEL;TYPE=CELL:${p.tel}`,`NOTE:${LEAGUE}`,"END:VCARD"].join("\r\n")).join("\r\n");
  const u=URL.createObjectURL(new Blob([v],{type:"text/vcard"}));
  const a=document.createElement("a");a.href=u;a.download=`${SLUG}.vcf`;a.click();URL.revokeObjectURL(u);
  document.getElementById("live").textContent="Contacts file downloaded";
};

mode(window.matchMedia("(pointer: coarse)").matches);
</script>
</body>
</html>
